<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKB48 グッズトレードメーカー</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2canvas for preview export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap');
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
        }
        /* Custom scrollbar for sticky tables */
        .scrollbar-thin::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .scrollbar-thin::-webkit-scrollbar-track {
            background: rgba(241, 245, 249, 0.8);
        }
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.6);
            border-radius: 3px;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 116, 139, 0.8);
        }
        /* Hide scrollbar for clean preview */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col antialiased selection:bg-pink-500 selection:text-white">

    <header class="bg-white/90 backdrop-blur border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-3 py-2.5 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
                <span class="text-2xl">💖</span>
                <div>
                    <h1 class="text-base font-extrabold text-slate-900 leading-tight">AKB48 グッズトレードメーカー</h1>
                </div>
            </div>

            <nav class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200 text-xs font-bold">
                <button onclick="switchTab('config')" id="nav-config" class="px-3 py-1.5 rounded-lg transition bg-pink-600 text-white shadow-sm">
                    1. メンバー・種類
                </button>
                <button onclick="switchTab('manage')" id="nav-manage" class="px-3 py-1.5 rounded-lg transition text-slate-600 hover:text-slate-900">
                    2. 譲・求登録
                </button>
                <button onclick="switchTab('preview')" id="nav-preview" class="px-3 py-1.5 rounded-lg transition text-slate-600 hover:text-slate-900">
                    3. 表プレビュー
                </button>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-4 space-y-4">

        <!-- TAB 1: Config Section -->
        <section id="tab-config" class="space-y-4">
            
            <!-- MEMBER SELECTION CARD WITH COLLAPSIBLE CONTAINER -->
            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-3">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <h2 class="font-bold text-sm text-slate-800 flex items-center gap-2">
                        <span>👥</span> 対象メンバー選択
                    </h2>
                    
                    <!-- 期生一括選択（1行表示） -->
                    <div class="flex items-center gap-1.5 overflow-x-auto pb-1 scrollbar-thin max-w-full">
                        <button type="button" onclick="selectByGen('all')" class="px-2.5 py-1 text-xs font-bold rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 transition whitespace-nowrap">全選択</button>
                        <button type="button" onclick="selectByGen('clear')" class="px-2.5 py-1 text-xs font-bold rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 border border-slate-300 transition whitespace-nowrap">全解除</button>
                        <span class="text-slate-300">|</span>
                        <button type="button" onclick="toggleGen('13期生')" class="px-2 py-1 text-xs font-bold rounded-lg bg-pink-50 hover:bg-pink-100 text-pink-700 border border-pink-200 transition whitespace-nowrap">13期</button>
                        <button type="button" onclick="toggleGen('15期生')" class="px-2 py-1 text-xs font-bold rounded-lg bg-pink-50 hover:bg-pink-100 text-pink-700 border border-pink-200 transition whitespace-nowrap">15期</button>
                        <button type="button" onclick="toggleGen('Team8')" class="px-2 py-1 text-xs font-bold rounded-lg bg-pink-50 hover:bg-pink-100 text-pink-700 border border-pink-200 transition whitespace-nowrap">Team8</button>
                        <button type="button" onclick="toggleGen('ドラフト2期')" class="px-2 py-1 text-xs font-bold rounded-lg bg-pink-50 hover:bg-pink-100 text-pink-700 border border-pink-200 transition whitespace-nowrap">ドラ2</button>
                        <button type="button" onclick="toggleGen('16期生')" class="px-2 py-1 text-xs font-bold rounded-lg bg-pink-50 hover:bg-pink-100 text-pink-700 border border-pink-200 transition whitespace-nowrap">16期</button>
                        <button type="button" onclick="toggleGen('17期生')" class="px-2 py-1 text-xs font-bold rounded-lg bg-pink-50 hover:bg-pink-100 text-pink-700 border border-pink-200 transition whitespace-nowrap">17期</button>
                        <button type="button" onclick="toggleGen('18期生')" class="px-2 py-1 text-xs font-bold rounded-lg bg-pink-50 hover:bg-pink-100 text-pink-700 border border-pink-200 transition whitespace-nowrap">18期</button>
                        <button type="button" onclick="toggleGen('19期生')" class="px-2 py-1 text-xs font-bold rounded-lg bg-pink-50 hover:bg-pink-100 text-pink-700 border border-pink-200 transition whitespace-nowrap">19期</button>
                        <button type="button" onclick="toggleGen('20期研究生')" class="px-2 py-1 text-xs font-bold rounded-lg bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200 transition whitespace-nowrap">20期</button>
                        <button type="button" onclick="toggleGen('21期研究生')" class="px-2 py-1 text-xs font-bold rounded-lg bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200 transition whitespace-nowrap">21期</button>
                        <button type="button" onclick="toggleGen('22期研究生')" class="px-2 py-1 text-xs font-bold rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 transition whitespace-nowrap">22期</button>
                    </div>
                </div>

                <!-- ACCORDION TOGGLE BUTTON -->
                <button type="button" onclick="toggleMemberListAccordion()" id="member-accordion-btn" class="w-full py-2 px-3 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl text-xs font-bold text-slate-700 flex items-center justify-between transition">
                    <span id="member-accordion-title">▼ クリックしてメンバー個人名一覧を開く</span>
                    <span id="member-accordion-count" class="text-pink-600 bg-pink-100 px-2 py-0.5 rounded-full font-bold">選択中: 0人</span>
                </button>

                <!-- COLLAPSIBLE MEMBERS LIST -->
                <div id="members-list-container" class="hidden space-y-3 pt-2">
                    <div class="flex justify-between items-center">
                        <span class="text-xs text-slate-500">（チェックを入れると交換表に反映されます）</span>
                        <div class="flex items-center gap-2">
                            <input type="text" id="new-member-input" placeholder="メンバー名追加" class="text-xs px-2.5 py-1 bg-white border border-slate-300 text-slate-800 rounded-lg focus:outline-none focus:border-pink-500 w-32">
                            <button onclick="addMember()" class="bg-pink-600 hover:bg-pink-500 text-white px-3 py-1 rounded-lg text-xs font-bold transition shadow-sm">追加</button>
                        </div>
                    </div>

                    <div id="members-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2 pr-1"></div>
                    
                    <div class="border-t border-slate-200 flex justify-end pt-2">
                        <button onclick="resetToDefaultMembers()" class="text-xs text-slate-500 hover:text-pink-600 underline transition">AKB48公式現役メンバーリストに復元</button>
                    </div>
                </div>
            </div>

            <!-- ITEM TYPES MANAGEMENT CARD -->
            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="flex items-center gap-2">
                        <h2 class="font-bold text-sm text-slate-800 flex items-center gap-2">
                            <span>🎴</span> グッズ種類一覧
                        </h2>
                        <span class="text-xs text-rose-500 font-normal">※多すぎると見切れることがあります</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="selectAllTypes(true)" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-lg font-bold border border-slate-300 transition">全選択</button>
                        <button onclick="selectAllTypes(false)" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-2.5 py-1 rounded-lg font-bold border border-slate-300 transition">全解除</button>
                    </div>
                </div>

                <!-- ITEM TYPES BADGES LIST (PRESET AT FRONT) -->
                <div id="types-list"></div>

                <!-- ITEM TYPES INPUT FORM PLACED DIRECTLY BELOW LIST -->
                <div class="pt-3 border-t border-slate-200 space-y-1.5">
                    <label for="goodsCategoryInput" class="block text-xs font-bold text-slate-700">
                        グッズ種類追加 <span class="text-xs text-slate-500 font-normal">（複数追加の場合はカンマ区切りで入力）</span>
                    </label>
                    <div class="flex items-center gap-2 max-w-xl">
                        <input type="text" id="goodsCategoryInput" placeholder="例: 缶バッジ, アクリルスタンド, 特典カード" class="flex-1 bg-white border border-slate-300 text-slate-800 placeholder-slate-400 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 transition">
                        <button type="button" onclick="addCustomCategories()" class="px-4 py-2 bg-pink-600 hover:bg-pink-500 text-white font-bold text-xs rounded-xl transition shadow-md flex items-center gap-1.5 whitespace-nowrap">
                            <i class="fa-solid fa-plus"></i> 種類を一括追加
                        </button>
                    </div>
                </div>
            </div>

            <div class="flex justify-end pt-2">
                <button onclick="switchTab('manage')" class="bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 text-white font-bold px-6 py-2.5 rounded-xl shadow-lg transition transform active:scale-95 text-xs flex items-center gap-2">
                    <span>次へ：譲・求登録へ進む</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </section>

        <!-- TAB 2: Manage Section -->
        <section id="tab-manage" class="space-y-3 hidden">
            <div class="bg-white rounded-2xl p-3 border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-2 flex-1 min-w-[200px]">
                    <i class="fa-solid fa-magnifying-glass text-slate-400 text-xs"></i>
                    <input type="text" id="member-search-input" oninput="renderManageGrid()" placeholder="メンバー名検索..." class="text-xs px-3 py-1.5 bg-white border border-slate-300 text-slate-800 rounded-xl focus:outline-none focus:border-pink-500 w-full max-w-xs">
                </div>
                
                <div class="flex items-center gap-2">
                    <div class="flex items-center gap-1.5">
                        <span class="text-xs font-bold text-slate-600">種類絞り込み:</span>
                        <select id="manage-filter-type" onchange="renderManageGrid()" class="text-xs px-2.5 py-1.5 bg-white border border-slate-300 text-slate-800 rounded-xl focus:outline-none focus:border-pink-500 font-medium">
                            <option value="all">すべての選択中種類</option>
                        </select>
                    </div>
                    <button onclick="clearAllInventory()" class="bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 font-bold px-3 py-1.5 rounded-xl text-xs transition flex items-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-trash-can"></i>
                        <span>全クリア</span>
                    </button>
                </div>
            </div>

            <!-- HIGH-DENSITY MANAGEMENT TABLE WITH STICKY HEADERS -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-x-auto max-h-[calc(100vh-210px)] scrollbar-thin">
                <table class="w-full text-left border-collapse min-w-max">
                    <thead class="sticky top-0 bg-slate-100 z-30 border-b border-slate-200 shadow-sm">
                        <tr id="manage-table-header-row">
                            <th class="p-2.5 font-bold text-slate-800 text-xs min-w-[160px] border-r border-slate-200 bg-slate-100 sticky left-0 z-40">
                                メンバー
                            </th>
                        </tr>
                    </thead>
                    <tbody id="manage-grid-container" class="divide-y divide-slate-200">
                    </tbody>
                </table>
            </div>

            <div class="flex justify-between items-center pt-2">
                <button onclick="switchTab('config')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-5 py-2 rounded-xl text-xs transition">
                    ← 戻る
                </button>
                <button onclick="switchTab('preview')" class="bg-pink-600 hover:bg-pink-500 text-white font-bold px-6 py-2 rounded-xl text-xs shadow-md transition flex items-center gap-1.5">
                    <span>表プレビューを確認する</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </section>

        <!-- TAB 3: Preview Section -->
        <section id="tab-preview" class="space-y-3 hidden">
            <!-- SAVE & LOAD SLOTS BAR -->
            <div class="bg-white rounded-2xl p-3 border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-slate-700 flex items-center gap-1">
                        <i class="fa-solid fa-cloud-arrow-down text-pink-600"></i> 一時保存マネージャー (最大5個):
                    </span>
                </div>
                <div class="flex items-center gap-2 flex-wrap">
                    <button onclick="openSaveModal()" class="bg-pink-600 hover:bg-pink-500 text-white font-bold px-3 py-1.5 rounded-xl text-xs transition shadow-sm flex items-center gap-1">
                        <i class="fa-solid fa-floppy-disk"></i> 状態を保存
                    </button>
                    <button onclick="openLoadModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-3 py-1.5 rounded-xl text-xs transition border border-slate-300 flex items-center gap-1">
                        <i class="fa-solid fa-folder-open"></i> 保存データ読込
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-3 border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-3">
                <div class="flex flex-col gap-1 flex-1 min-w-[200px]">
                    <label class="text-xs font-bold text-slate-600 flex items-center justify-between">
                        <span>タイトル:</span>
                        <span class="text-[11px] font-normal text-pink-600">※イベント名やグッズ名を入力してください</span>
                    </label>
                    <input type="text" id="export-title" value="AKB48　トレード一覧表" class="text-xs px-3 py-1.5 bg-white border border-slate-300 text-slate-800 rounded-xl focus:outline-none focus:border-pink-500 w-full font-bold">
                </div>
                <div class="flex flex-col gap-1 min-w-[180px]">
                    <label class="text-xs font-bold text-slate-600">連絡先 (半角入力):</label>
                    <input type="text" id="export-contact" value="" placeholder="@X_account" inputmode="email" class="text-xs px-3 py-1.5 bg-white border border-slate-300 text-slate-800 rounded-xl focus:outline-none focus:border-pink-500 w-full font-medium">
                </div>
            </div>

            <!-- EXPORT CARD (Forced fixed width container to ensure identical layout on smartphones and PCs) -->
            <div id="capture-area-container" class="flex justify-center items-center w-full py-2 overflow-x-auto scrollbar-thin">
                <div id="capture-area" class="bg-gradient-to-br from-pink-50 via-white to-purple-50 border-2 border-pink-300 rounded-2xl p-3 shadow-xl flex flex-col justify-between w-[640px] min-w-[640px] shrink-0 h-auto no-scrollbar">
                    <div class="space-y-2">
                        <!-- Preview Header -->
                        <div class="text-center space-y-1 pb-2 border-b-2 border-pink-300">
                            <h2 id="preview-title-display" class="font-black text-xl text-pink-700 tracking-wide">AKB48　トレード一覧表</h2>
                            <div class="flex justify-center items-center gap-2 text-xs text-slate-600 font-semibold">
                                <span id="preview-contact-display"></span>
                                <span id="preview-contact-sep">・</span>
                                <span id="preview-date">2026/10/10</span>
                            </div>
                        </div>

                        <!-- Independent Side-by-Side 2-Column Tables (Fixed grid-cols-2 layout for consistent export on mobile) -->
                        <div id="preview-tables-container" class="grid grid-cols-2 gap-2 items-start w-full">
                            <div id="preview-table-have-wrapper" class="w-full"></div>
                            <div id="preview-table-want-wrapper" class="w-full"></div>
                        </div>
                    </div>

                    <!-- Footer Note -->
                    <div class="pt-2 mt-2 text-center text-xs text-pink-600 font-bold flex justify-between px-2 border-t border-pink-200">
                        <span>AKB48 グッズトレードメーカー</span>
                        <span>#AKB48 #グッズ交換</span>
                    </div>
                </div>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
                <button onclick="switchTab('manage')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-5 py-2.5 rounded-xl text-xs transition">
                    ← 戻る
                </button>
                <button onclick="downloadImage()" class="bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 text-white font-black px-6 py-2.5 rounded-xl shadow-lg transition transform active:scale-95 text-xs flex items-center gap-2">
                    <i class="fa-solid fa-camera"></i>
                    <span>画像として保存 (JPG)</span>
                </button>
            </div>
        </section>

    </main>

    <!-- SAVE SLOT MODAL -->
    <div id="save-slot-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl p-5 max-w-md w-full shadow-2xl border border-slate-200 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-200 pb-2">
                <h3 class="font-black text-sm text-slate-800 flex items-center gap-1.5">
                    <span>💾</span> 現在の状態を一時保存
                </h3>
                <button onclick="closeSaveModal()" class="text-slate-400 hover:text-slate-700 font-bold text-sm">✕</button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">保存データ名（タイトル）:</label>
                    <input type="text" id="save-slot-name-input" placeholder="例: 10/14 劇場公演トレード用" class="w-full text-xs px-3 py-2 bg-white border border-slate-300 rounded-xl focus:outline-none focus:border-pink-500 font-bold">
                </div>
                <div id="save-slot-info-box" class="text-xs text-slate-500 bg-slate-50 p-2 rounded-xl border border-slate-200">
                    現在の保存数: <span id="save-count-badge" class="font-bold text-pink-600">0</span> / 5スロット
                </div>
                <div id="save-overwrite-container" class="hidden space-y-2 pt-2 border-t border-slate-200">
                    <p class="text-xs font-bold text-rose-600">⚠️ 保存スロットが上限（5個）に達しています。上書きするスロットを選択してください：</p>
                    <div id="save-overwrite-list" class="space-y-1.5 max-h-48 overflow-y-auto"></div>
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeSaveModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl text-xs transition">キャンセル</button>
                <button onclick="executeSave()" id="execute-save-btn" class="px-4 py-2 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-xl text-xs transition shadow-md">新しく保存する</button>
            </div>
        </div>
    </div>

    <!-- LOAD SLOT MODAL -->
    <div id="load-slot-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl p-5 max-w-md w-full shadow-2xl border border-slate-200 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-200 pb-2">
                <h3 class="font-black text-sm text-slate-800 flex items-center gap-1.5">
                    <span>📁</span> 保存データの一覧・読込
                </h3>
                <button onclick="closeLoadModal()" class="text-slate-400 hover:text-slate-700 font-bold text-sm">✕</button>
            </div>
            <div id="load-slots-container" class="space-y-2 max-h-64 overflow-y-auto pr-1"></div>
            <div class="flex justify-end pt-2">
                <button onclick="closeLoadModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl text-xs transition">閉じる</button>
            </div>
        </div>
    </div>

    <!-- NOTIFICATION MODAL -->
    <div id="notification-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div id="modal-box" class="bg-white rounded-2xl p-5 max-w-sm w-full shadow-2xl border border-slate-200 transform scale-95 transition-transform duration-300 space-y-4 text-center">
            <div id="modal-icon" class="text-4xl">✨</div>
            <div class="space-y-1">
                <h3 id="modal-title" class="font-black text-base text-slate-800">お知らせ</h3>
                <p id="modal-message" class="text-xs text-slate-600 leading-relaxed"></p>
            </div>
            <button onclick="closeModal()" class="w-full py-2 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-xl text-xs transition shadow-md">
                OK
            </button>
        </div>
    </div>

    <script>
        // Official AKB48 Current Members List (Official Roster & Order from https://www.akb48.co.jp/about/members)
        const akb48OfficialMembers = [
            { name: "岩立 沙穂", gen: "13期生", selected: true },
            { name: "福岡 聖菜", gen: "15期生", selected: true },
            { name: "小栗 有以", gen: "Team8", selected: true },
            { name: "行天 優莉奈", gen: "Team8", selected: true },
            { name: "倉野尾 成美", gen: "Team8", selected: true },
            { name: "坂川 陽香", gen: "Team8", selected: true },

        function addCustomCategories() {
            const inputEl = document.getElementById('goodsCategoryInput');
            if (!inputEl) return;
            const val = inputEl.value.trim();
            if (!val) {
                showModal("⚠️ 入力エラー", "追加するグッズ種類を入力してください。");
                return;
            }

            const categories = val.split(/[,、]/).map(c => c.trim()).filter(c => c.length > 0);
            let addedCount = 0;
            categories.forEach(cat => {
                if (!state.itemTypes.some(t => t.name === cat)) {
                    state.itemTypes.push({ name: cat, selected: true });
                    addedCount++;
                }
            });

            if (addedCount > 0) {
                inputEl.value = '';
                saveStorage();
                renderConfig();
                showModal("✨ 追加完了", `${addedCount} 件のグッズ種類を追加しました！`);
            } else {
                showModal("ℹ️ 確認", "入力された種類はすでに登録されています。");
            }
        }

            const input = document.getElementById('new-member-input');

            const name = input.value.trim();
            if (state.members.some(m => m.name === name)) {
                showModal("⚠️ 重複", "すでに登録されているメンバー名です。");
                return;
            }
            state.members.push({ name, gen: 'その他', selected: true });
            input.value = '';
            saveStorage();
            renderConfig();
        }

            let html = '';

                html += `
                    <tr class="${rowBg} hover:bg-pink-50/40 transition">

                activeTypes.forEach(typeObj => {
                    const type = typeObj.name;
                    const key = `${member}_${type}`;
                    const itemData = state.inventory[key] || { have: 0, want: false };
                    const haveCount = itemData.have || 0;
                    const wantActive = itemData.want || false;
                    const hasAny = haveCount > 0 || wantActive;

                    html += `
                        <td class="px-2 py-1.5 text-center border-r border-slate-200">
                            <div class="inline-flex items-center justify-center gap-1">

                html += `</tr>`;

            container.innerHTML = html;

        function adjustStatus(member, type, field) {
            const key = `${member}_${type}`;
            if (!state.inventory[key]) {
                state.inventory[key] = { have: 0, want: false };
            }
            
            if (field === 'have') {
                state.inventory[key].have = (state.inventory[key].have || 0) + 1;
                if (state.inventory[key].have > 9) state.inventory[key].have = 0;
            } else if (field === 'want') {
                state.inventory[key].want = !state.inventory[key].want;
            }

            saveStorage();
            renderManageGrid();
        }

        function clearStatus(member, type) {
            const key = `${member}_${type}`;
            delete state.inventory[key];
            saveStorage();
            renderManageGrid();
        }

        function toggleMemberAllWant(member) {
            const activeTypes = state.itemTypes.filter(t => t.selected);
            const allCurrentlyWant = activeTypes.every(t => (state.inventory[`${member}_${t.name}`]?.want) === true);

            activeTypes.forEach(t => {
                const key = `${member}_${t.name}`;
                if (!state.inventory[key]) {
                    state.inventory[key] = { have: 0, want: false };
                }
                state.inventory[key].want = !allCurrentlyWant;
            });

            saveStorage();
            renderManageGrid();
        }

        function clearMemberInventory(member) {
            Object.keys(state.inventory).forEach(key => {
                if (key.startsWith(`${member}_`)) {
                    delete state.inventory[key];
                }
            });
            saveStorage();
            renderManageGrid();
        }

        function clearAllInventory() {
            if (Object.keys(state.inventory).length === 0) return;
            state.inventory = {};
            saveStorage();
            renderManageGrid();
            showModal("🧹 リセット完了", "すべての譲・求登録データを取り消しました。");
        }

        // SLOTS MANAGEMENT (UP TO 5 SLOTS)
        function getSavedSlots() {
            try {
                const data = localStorage.getItem('akb48_goods_trade_slots_v1');
                return data ? JSON.parse(data) : [];
            } catch (e) {
                return [];
            }
        }

        function saveSlotsToStorage(slots) {
            try {
                localStorage.setItem('akb48_goods_trade_slots_v1', JSON.stringify(slots));
            } catch (e) {
                console.error('Slots save failed', e);
            }
        }

        function openSaveModal() {
            const modal = document.getElementById('save-slot-modal');
            const nameInput = document.getElementById('save-slot-name-input');
            const saveCountBadge = document.getElementById('save-count-badge');
            const overwriteContainer = document.getElementById('save-overwrite-container');
            const overwriteList = document.getElementById('save-overwrite-list');
            const executeBtn = document.getElementById('execute-save-btn');

            const slots = getSavedSlots();
            if (saveCountBadge) saveCountBadge.innerText = slots.length;

            const titleInput = document.getElementById('export-title');
            if (nameInput && titleInput) {
                nameInput.value = titleInput.value || 'AKB48 トレード一覧';
            }

            if (slots.length >= 5) {
                if (overwriteContainer) overwriteContainer.classList.remove('hidden');
                if (executeBtn) executeBtn.classList.add('hidden'); // Overwrite selection required

                if (overwriteList) {
                    overwriteList.innerHTML = slots.map((slot, idx) => `
                        <div class="flex items-center justify-between p-2 bg-slate-50 border border-slate-200 rounded-xl hover:bg-pink-50 transition">
                            <div class="truncate">
                                <span class="font-bold text-xs text-slate-800">${slot.name}</span>
                                <span class="text-[10px] text-slate-400 block">${slot.date}</span>
                            </div>
                            <button onclick="executeOverwrite(${idx})" class="px-3 py-1 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-lg text-xs transition whitespace-nowrap shadow-sm">
                                上書き保存
                            </button>
                        </div>
                    `).join('');
                }
            } else {
                if (overwriteContainer) overwriteContainer.classList.add('hidden');
                if (executeBtn) executeBtn.classList.remove('hidden');
            }

            if (modal) {
                modal.classList.remove('hidden');
                setTimeout(() => modal.classList.remove('opacity-0'), 10);
            }
        }

        function closeSaveModal() {
            const modal = document.getElementById('save-slot-modal');
            if (modal) {
                modal.classList.add('opacity-0');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
        }

        function executeSave() {
            const nameInput = document.getElementById('save-slot-name-input');
            const slotName = nameInput && nameInput.value.trim() ? nameInput.value.trim() : '無題のトレード表';
            
            const slots = getSavedSlots();
            if (slots.length >= 5) {
                showModal("⚠️ 上書き必要", "保存スロットが5個満杯です。上書きするスロットを選択してください。");
                return;
            }

            const now = new Date();
            const dateStr = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            const slotData = {
                name: slotName,
                date: dateStr,
                title: document.getElementById('export-title')?.value || '',
                contact: document.getElementById('export-contact')?.value || '',
                state: JSON.parse(JSON.stringify(state))
            };

            slots.push(slotData);
            saveSlotsToStorage(slots);
            closeSaveModal();
            showModal("✨ 保存成功", `「${slotName}」を一時保存しました！`);
        }

        function executeOverwrite(index) {
            const nameInput = document.getElementById('save-slot-name-input');
            const slotName = nameInput && nameInput.value.trim() ? nameInput.value.trim() : '無題のトレード表';
            
            const slots = getSavedSlots();
            const now = new Date();
            const dateStr = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            slots[index] = {
                name: slotName,
                date: dateStr,
                title: document.getElementById('export-title')?.value || '',
                contact: document.getElementById('export-contact')?.value || '',
                state: JSON.parse(JSON.stringify(state))
            };

            saveSlotsToStorage(slots);
            closeSaveModal();
            showModal("✨ 上書き保存成功", `スロット ${index + 1} に「${slotName}」を上書き保存しました！`);
        }

        function openLoadModal() {
            const modal = document.getElementById('load-slot-modal');
            const container = document.getElementById('load-slots-container');
            const slots = getSavedSlots();

            if (container) {
                if (slots.length === 0) {

                } else {

                            <div class="truncate pr-2">
                                <span class="font-bold text-xs text-slate-800 block truncate">${slot.name}</span>
                                <span class="text-[10px] text-slate-400">${slot.date}</span>
                            </div>
                            <div class="flex items-center gap-1 shrink-0">
                                <button onclick="loadSlotData(${idx})" class="px-3 py-1 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-lg text-xs transition shadow-sm">
                                    読込
                                </button>
                                <button onclick="deleteSlot(${idx})" class="px-2 py-1 bg-slate-200 hover:bg-rose-100 hover:text-rose-700 text-slate-600 font-bold rounded-lg text-xs transition">
                                    削除
                                </button>
                            </div>
                        </div>
                    `).join('');
                }
            }

            if (modal) {
                modal.classList.remove('hidden');
                setTimeout(() => modal.classList.remove('opacity-0'), 10);
            }
        }

        function closeLoadModal() {
            const modal = document.getElementById('load-slot-modal');
            if (modal) {
                modal.classList.add('opacity-0');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
        }

        function loadSlotData(index) {
            const slots = getSavedSlots();
            const slot = slots[index];
            if (!slot) return;

            state = JSON.parse(JSON.stringify(slot.state));
            saveStorage();

            const titleInput = document.getElementById('export-title');
            const contactInput = document.getElementById('export-contact');
            if (titleInput && slot.title) titleInput.value = slot.title;
            if (contactInput && slot.contact !== undefined) contactInput.value = slot.contact;

            renderConfig();
            closeLoadModal();
            showModal("📂 読込完了", `「${slot.name}」のデータを正常に読み込みました！`);
        }

        function deleteSlot(index) {
            const slots = getSavedSlots();
            const deleted = slots.splice(index, 1);
            saveSlotsToStorage(slots);
            openLoadModal();
            showModal("🗑️ 削除完了", `保存データを削除しました。`);
        }

        function renderPreview() {
            const haveWrapper = document.getElementById('preview-table-have-wrapper');
            const wantWrapper = document.getElementById('preview-table-want-wrapper');
            const containerLayout = document.getElementById('preview-tables-container');
            const titleInput = document.getElementById('export-title');
            const contactInput = document.getElementById('export-contact');
            const titleDisplay = document.getElementById('preview-title-display');
            const contactDisplay = document.getElementById('preview-contact-display');
            const contactSep = document.getElementById('preview-contact-sep');
            const dateDisplay = document.getElementById('preview-date');

            if (!haveWrapper || !wantWrapper || !containerLayout) return;

            if (titleDisplay && titleInput) titleDisplay.innerText = titleInput.value;
            
            if (contactDisplay && contactInput) {
                const contactValue = contactInput.value.trim();
                if (contactValue) {
                    contactDisplay.innerText = `連絡先: ${contactValue}`;
                    contactDisplay.style.display = 'inline';
                    if (contactSep) contactSep.style.display = 'inline';
                } else {
                    contactDisplay.innerText = '';
                    contactDisplay.style.display = 'none';
                    if (contactSep) contactSep.style.display = 'none';
                }
            }

            if (dateDisplay) dateDisplay.innerText = new Date().toLocaleDateString('ja-JP');

            const activeMembers = state.members.filter(m => m.selected);
            const selectedTypes = state.itemTypes.filter(t => t.selected);

            if (selectedTypes.length === 0 || activeMembers.length === 0) {
                haveWrapper.innerHTML = `<div class="text-center py-4 text-slate-400 text-xs">種類・メンバーを選択してください。</div>`;
                haveWrapper.style.display = 'block';
                wantWrapper.innerHTML = '';
                wantWrapper.style.display = 'none';
                return;
            }

            const protectedTypes = ['ヨリ', 'チュウ', 'ヒキ'];
            const activeTypes = selectedTypes.filter(t => {
                if (protectedTypes.includes(t.name)) {
                    return true;
                }
                return activeMembers.some(m => {
                    const inv = state.inventory[`${m.name}_${t.name}`];
                    return (inv?.have || 0) > 0 || (inv?.want === true);
                });
            });

            if (activeTypes.length === 0) {
                haveWrapper.innerHTML = `<div class="bg-white rounded-xl border border-slate-200 p-6 text-center text-slate-400 text-xs shadow-sm">表示可能な対象グッズがありません。</div>`;
                haveWrapper.style.display = 'block';
                wantWrapper.innerHTML = '';
                wantWrapper.style.display = 'none';
                return;
            }

            const formatPreviewMemberName = (fullName) => {
                const parts = fullName.trim().split(/\s+/);
                if (parts.length < 2) return fullName;
                
                const lastName = parts[0];
                const firstName = parts[1];
                
                const duplicatedSurnames = ['髙橋', '高橋', '橋本', '山内'];
                if (duplicatedSurnames.includes(lastName) && firstName.length > 0) {
                    return `${lastName}${firstName.charAt(0)}`;
                }
                
                return lastName;
            };

            const haveMembers = activeMembers.filter(m => {
                return activeTypes.some(t => (state.inventory[`${m.name}_${t.name}`]?.have || 0) > 0);
            });

            const wantMembers = activeMembers.filter(m => {
                return activeTypes.some(t => (state.inventory[`${m.name}_${t.name}`]?.want === true));
            });

            const generateTableHtml = (membersList, typeLabel, headerColorClass, borderClass, cellColorClass, isWantTable = false) => {
                if (membersList.length === 0) return '';

                const headerBorder = isWantTable ? 'border-purple-300' : 'border-pink-300';
                const headerBg = isWantTable ? 'bg-purple-100' : 'bg-pink-100';
                const headerText = isWantTable ? 'text-purple-900' : 'text-pink-900';

                const typeColWidth = activeTypes.length > 0 ? (82 / activeTypes.length).toFixed(2) : 10;

                let html = `
                    <div class="bg-white rounded-xl border-2 ${borderClass} overflow-hidden shadow-sm w-full">
                        <div class="${headerColorClass} text-white font-bold py-1 px-2 text-center text-xs">${typeLabel}</div>
                        <table class="w-full text-xs border-collapse table-fixed">
                            <thead>
                                <tr class="${headerBg} ${headerText} font-bold border-b-2 ${headerBorder}">
                                    <th class="py-1 px-0.5 border-r-2 ${headerBorder} whitespace-nowrap text-center" style="width: 18%;"></th>
                                    ${activeTypes.map((t, i) => {
                                        const isLong = t.name.length >= 6;
                                        const fontSizeStyle = isLong ? 'font-size: 8px;' : 'font-size: 9px;';
                                        const wrapClass = isLong ? 'break-words whitespace-normal' : 'truncate whitespace-nowrap';
                                        return `
                                            <th class="py-1.5 px-0.5 text-center font-bold ${wrapClass} leading-tight ${i < activeTypes.length - 1 ? `border-r-2 ${headerBorder}` : ''}" style="width: ${typeColWidth}%; ${fontSizeStyle}">
                                                ${t.name}
                                            </th>
                                        `;
                                    }).join('')}
                                </tr>
                            </thead>
                            <tbody>
                `;

                membersList.forEach((m, idx) => {
                    const memberKey = m.name;
                    const displayName = formatPreviewMemberName(m.name);
                    const rowBg = idx % 2 === 0 ? 'bg-white' : (isWantTable ? 'bg-purple-50/80' : 'bg-pink-50/80');
                    const nameCellBg = idx % 2 === 0 ? 'bg-slate-100' : (isWantTable ? 'bg-purple-100/90' : 'bg-pink-100/90');

                    html += `
                        <tr class="${rowBg} border-b border-slate-300">
                            <td class="py-1 px-0.5 font-bold text-slate-800 border-r-2 border-slate-300 ${nameCellBg} text-center align-middle break-words" style="font-size: 11px;">${displayName}</td>
                    `;

                    activeTypes.forEach((t, i) => {
                        const inv = state.inventory[`${memberKey}_${t.name}`];
                        let displayVal = '-';
                        let hasValue = false;

                        if (isWantTable) {
                            if (inv?.want === true) {
                                displayVal = '求';
                                hasValue = true;
                            }
                        } else {
                            const count = inv?.have || 0;
                            if (count > 0) {
                                displayVal = count;
                                hasValue = true;
                            }
                        }

                        html += `
                            <td class="py-1 px-0.5 text-center align-middle font-black ${i < activeTypes.length - 1 ? 'border-r border-slate-300' : ''} ${hasValue ? cellColorClass : 'text-slate-300'}">
                                ${displayVal}
                            </td>
                        `;
                    });

                    html += `</tr>`;
                });

                html += `</tbody></table></div>`;
                return html;
            };

            const hasHave = haveMembers.length > 0;
            const hasWant = wantMembers.length > 0;

            if (!hasHave && !hasWant) {
                containerLayout.className = "grid grid-cols-1 gap-2 items-start w-full";
                haveWrapper.style.display = 'block';
                haveWrapper.innerHTML = `<div class="bg-white rounded-xl border border-slate-200 p-6 text-center text-slate-400 text-xs shadow-sm">登録されている「譲」または「求」データがありません。</div>`;
                wantWrapper.innerHTML = '';
                wantWrapper.style.display = 'none';
                return;
            }

            // Always enforce 2-column grid layout (grid-cols-2) and fixed width on mobile for capture area
            containerLayout.className = "grid grid-cols-2 gap-2 items-start w-full";

            if (hasHave) {
                haveWrapper.style.display = 'block';
                haveWrapper.innerHTML = generateTableHtml(
                    haveMembers, 
                    '🎁 【 譲 】', 
                    'bg-pink-600', 
                    'border-pink-300', 
                    'text-pink-700 bg-pink-100/60', 
                    false
                );
            } else {
                haveWrapper.style.display = 'block';
                haveWrapper.innerHTML = `<div class="bg-white rounded-xl border border-slate-200 p-4 text-center text-slate-400 text-xs shadow-sm">譲データなし</div>`;
            }

            if (hasWant) {
                wantWrapper.style.display = 'block';
                wantWrapper.innerHTML = generateTableHtml(
                    wantMembers, 
                    '🔍 【 求 】', 
                    'bg-purple-600', 
                    'border-purple-300', 
                    'text-purple-700 bg-purple-100/60', 
                    true
                );
            } else {
                wantWrapper.style.display = 'block';
                wantWrapper.innerHTML = `<div class="bg-white rounded-xl border border-slate-200 p-4 text-center text-slate-400 text-xs shadow-sm">求データなし</div>`;
            }
        }

        // Image Download
        function downloadImage() {
            const captureArea = document.getElementById('capture-area');
            if (!captureArea) return;
            showModal("⌛ 画像を作成中", "高画質交換表画像を生成しています...");

            html2canvas(captureArea, {
                scale: 2,
                backgroundColor: '#ffffff',
                useCORS: true
            }).then(canvas => {
                closeModal();
                const image = canvas.toDataURL('image/jpeg', 0.95);
                
                const titleInput = document.getElementById('export-title');
                const rawTitle = (titleInput && titleInput.value.trim()) ? titleInput.value.trim() : 'AKB48_トレード一覧表';
                const safeTitle = rawTitle.replace(/[\\/:*?"<>|]/g, '_');
                
                const now = new Date();
                const yyyy = now.getFullYear();
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                const dd = String(now.getDate()).padStart(2, '0');
                const dateStr = `${yyyy}${mm}${dd}`;

                const fileName = `${safeTitle}_${dateStr}.jpg`;

                const link = document.createElement('a');
                link.href = image;
                link.download = fileName;
                link.click();
            }).catch(err => {
                console.error(err);
                closeModal();
                showModal("❌ エラー", "画像の生成に失敗しました。");
            });
        }

        // Modal Controls
        function showModal(title, message, icon = "✨") {
            const modal = document.getElementById('notification-modal');
            const box = document.getElementById('modal-box');
            const titleEl = document.getElementById('modal-title');
            const msgEl = document.getElementById('modal-message');
            const iconEl = document.getElementById('modal-icon');

            if (titleEl) titleEl.innerText = title;
            if (msgEl) msgEl.innerText = message;
            if (iconEl) iconEl.innerText = icon;
            
            if (modal && box) {
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    box.classList.remove('scale-95');
                    box.classList.add('scale-100');
                }, 10);
            }
        }

        function closeModal() {
            const modal = document.getElementById('notification-modal');
            const box = document.getElementById('modal-box');
            if (modal && box) {
                modal.classList.add('opacity-0');
                box.classList.remove('scale-100');
                box.classList.add('scale-95');
                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 300);
            }
        }

        // Initialize App on DOM Load
        document.addEventListener('DOMContentLoaded', () => {
            loadStorage();
            renderConfig();
            
            const exportTitle = document.getElementById('export-title');
            const exportContact = document.getElementById('export-contact');

            if (exportTitle) exportTitle.addEventListener('input', renderPreview);
            if (exportContact) exportContact.addEventListener('input', renderPreview);
        });
    </script>
</body>
</html>
